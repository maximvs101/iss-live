<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="ISS Live">
  <title>ISS Live</title>
  <!-- The ground track the home page draws, in the console's colours: grey behind the station,
       green ahead of it, the station where it crosses. Amber stays out — it means a warning. -->
  <rect width="32" height="32" rx="3" fill="#05080c"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="2.5" fill="none" stroke="#243545"/>
  <path d="M3 16C7.73 4 11.27 4 16 16" fill="none" stroke="#70839a" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 16C20.73 28 24.27 28 29 16" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.4" fill="#4ade80" stroke="#05080c" stroke-width="1.4"/>
</svg>
