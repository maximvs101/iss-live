# Build only. The cache policy lives in public/_headers, which Netlify and Cloudflare Pages both
# read from the root of the published directory — one statement of it rather than two that drift.
[build]
  command = "npm run build"
  publish = "dist"

# No NODE_VERSION here on purpose. Netlify reads .nvmrc, which is the one place this project states
# its Node version — repeating the number is how it goes stale, and a stale one means npm ci fails
# on a lock written by a different npm.
